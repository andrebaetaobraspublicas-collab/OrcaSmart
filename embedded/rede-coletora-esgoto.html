document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\n\u003ctitle\u003eEsgotoCalc Pro — Dimensionamento de Redes Coletoras de Esgoto Sanitário\u003c/title\u003e\n\u003cstyle\u003e\n:root{\n  --paper:#EDF1F0; --paper2:#F7F9F8; --grid:rgba(14,42,51,.07);\n  --ink:#0E2A33; --ink2:#3A5A63; --ink3:#6B858C;\n  --line:#C9D6D6; --line2:#DDE6E5;\n  --hydro:#12718F; --hydro-soft:#D6EAF1;\n  --ocre:#B26A12; --ocre-soft:#F6E7CE;\n  --ok:#2C7A50; --ok-soft:#DCEDE2;\n  --warn:#B0791A; --warn-soft:#F7EBD2;\n  --fail:#A6302A; --fail-soft:#F6DEDB;\n  --solo:#B9A98B; --tubo:#5A6E75;\n  --shadow:0 1px 2px rgba(14,42,51,.06),0 8px 24px -12px rgba(14,42,51,.22);\n  --r:3px;\n  --ff-ui:ui-sans-serif,system-ui,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --ff-mono:ui-monospace,\"SFMono-Regular\",\"SF Mono\",Menlo,Consolas,\"Liberation Mono\",monospace;\n}\nhtml[data-tema=\"escuro\"]{\n  --paper:#0C1A1F; --paper2:#122529; --grid:rgba(180,214,220,.06);\n  --ink:#E4EEEF; --ink2:#A8C0C5; --ink3:#7C979D;\n  --line:#25424A; --line2:#1B333A;\n  --hydro:#4FB8D8; --hydro-soft:#0E3542;\n  --ocre:#E0A44B; --ocre-soft:#3A2B12;\n  --ok:#5FBE8A; --ok-soft:#12331F;\n  --warn:#DDB05A; --warn-soft:#33280F;\n  --fail:#E5766C; --fail-soft:#3A1613;\n  --solo:#6B5F49; --tubo:#8AA3AB;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--ff-ui); color:var(--ink); background:var(--paper);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:24px 24px;\n  font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;\n}\n/* ---------- Cabeçalho ---------- */\nheader.topo{\n  position:sticky; top:0; z-index:50;\n  background:var(--paper2); border-bottom:1px solid var(--line);\n  box-shadow:var(--shadow);\n}\n.topo-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.marca{display:flex;align-items:baseline;gap:9px;min-width:0}\n.marca b{\n  font-size:18px;font-weight:800;letter-spacing:-.35px;\n  text-transform:uppercase; white-space:nowrap;\n}\n.marca b span{color:var(--hydro)}\n.marca .ver{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line);padding:1px 5px;border-radius:2px}\n.marca .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap}\n.topo-acoes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}\n/* ---------- Botões ---------- */\nbutton,.btn{\n  font-family:var(--ff-ui);font-size:12.5px;font-weight:600;\n  padding:6px 11px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);\n  border-radius:var(--r);cursor:pointer;transition:background .12s,border-color .12s,transform .05s;\n}\nbutton:hover,.btn:hover{background:var(--hydro-soft);border-color:var(--hydro)}\nbutton:active{transform:translateY(1px)}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hydro);outline-offset:2px}\nbutton.pri{background:var(--hydro);border-color:var(--hydro);color:#fff}\nbutton.pri:hover{filter:brightness(1.08);background:var(--hydro)}\nbutton.mini{padding:3px 7px;font-size:11px}\nbutton.danger{color:var(--fail);border-color:var(--line)}\nbutton.danger:hover{background:var(--fail-soft);border-color:var(--fail)}\nbutton[disabled]{opacity:.45;cursor:not-allowed}\n/* ---------- Navegação em pranchas ---------- */\nnav.pranchas{background:var(--paper2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}\n.pranchas-in{max-width:1400px;margin:0 auto;display:flex;gap:0;padding:0 8px;min-width:max-content}\n.aba{\n  display:flex;align-items:center;gap:7px;padding:9px 13px;border:0;background:transparent;\n  border-bottom:2px solid transparent;border-radius:0;color:var(--ink2);font-weight:600;font-size:12.5px;white-space:nowrap;\n}\n.aba:hover{background:transparent;border-bottom-color:var(--line);color:var(--ink)}\n.aba .num{font-family:var(--ff-mono);font-size:10px;color:var(--ink3);letter-spacing:.5px}\n.aba[aria-selected=\"true\"]{color:var(--hydro);border-bottom-color:var(--hydro)}\n.aba[aria-selected=\"true\"] .num{color:var(--hydro)}\n/* ---------- Layout ---------- */\nmain{max-width:1400px;margin:0 auto;padding:18px 16px 64px}\n.painel[hidden]{display:none}\n.grade{display:grid;gap:14px}\n.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}\n.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}\n.card{\n  background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);\n  padding:14px;box-shadow:var(--shadow);\n}\n.card\u003eh3{\n  margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);\n  border-bottom:1px solid var(--line2);padding-bottom:7px;display:flex;align-items:center;gap:8px;justify-content:space-between;\n}\n.card\u003eh3 .tag{font-family:var(--ff-mono);font-weight:600;letter-spacing:0;text-transform:none;font-size:10.5px;color:var(--ink3)}\nh2.titulo{\n  margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.4px;\n}\np.lede{margin:0 0 16px;color:var(--ink2);font-size:13px;max-width:78ch}\n.divisor{height:1px;background:var(--line2);margin:14px 0}\n/* ---------- Campos ---------- */\n.campo{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}\n.campo label{font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;gap:6px;align-items:baseline}\n.campo label .un{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink3);font-weight:500}\ninput,select,textarea{\n  font-family:var(--ff-mono);font-size:13px;padding:6px 8px;\n  border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);width:100%;\n}\nselect{font-family:var(--ff-ui)}\ninput[type=checkbox]{width:auto;accent-color:var(--hydro)}\n.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:7px;cursor:pointer}\n.ajuda{font-size:11px;color:var(--ink3);line-height:1.4}\n/* ---------- Resultados ---------- */\n.res{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}\n.res .lin{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--paper2);padding:6px 9px}\n.res .lin b{font-family:var(--ff-mono);font-size:13.5px;font-weight:700;white-space:nowrap}\n.res .lin span{font-size:12px;color:var(--ink2)}\n.res .lin small{font-family:var(--ff-mono);color:var(--ink3);font-size:10.5px}\n.kpi{background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--hydro);border-radius:var(--r);padding:9px 11px}\n.kpi .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);font-weight:700}\n.kpi .val{font-family:var(--ff-mono);font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.25}\n.kpi .obs{font-size:11px;color:var(--ink2)}\n.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.fail{border-left-color:var(--fail)}\n.selo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px solid}\n.selo.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}\n.selo.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}\n.selo.fail{background:var(--fail-soft);color:var(--fail);border-color:var(--fail)}\n.selo.neutro{background:var(--paper);color:var(--ink3);border-color:var(--line)}\n/* ---------- Tabelas ---------- */\n.tabela-rolo{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper2)}\ntable{border-collapse:collapse;width:100%;font-size:12px}\nth,td{padding:5px 7px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}\nth{\n  background:var(--paper);position:sticky;top:0;z-index:2;\n  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:800;\n  border-bottom:1px solid var(--line);\n}\nth.esq,td.esq{text-align:left}\ntd{font-family:var(--ff-mono)}\ntd.txt{font-family:var(--ff-ui)}\ntbody tr:hover{background:var(--hydro-soft)}\ntbody tr.reprovado{background:var(--fail-soft)}\ntbody tr.reprovado:hover{background:var(--fail-soft);filter:brightness(.97)}\ntbody tr.alerta{background:var(--warn-soft)}\ntable input,table select{padding:3px 5px;font-size:11.5px;min-width:62px}\ncaption{caption-side:bottom;text-align:left;padding:7px;font-size:11px;color:var(--ink3)}\n.num-cel{font-variant-numeric:tabular-nums}\n/* ---------- Perfil (assinatura) ---------- */\n.prancha{\n  background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow);\n}\n.prancha-cab{\n  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;\n  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper);\n  font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);\n}\n.prancha-cab b{color:var(--ink);font-size:11px}\n#perfilBox{overflow:auto;background:var(--paper2)}\n#perfil{display:block;min-width:720px}\n/* ---------- Avisos ---------- */\n.aviso{border:1px solid;border-left-width:3px;border-radius:var(--r);padding:9px 11px;font-size:12.5px;margin-bottom:9px}\n.aviso.info{background:var(--hydro-soft);border-color:var(--hydro);color:var(--ink)}\n.aviso.ok{background:var(--ok-soft);border-color:var(--ok)}\n.aviso.warn{background:var(--warn-soft);border-color:var(--warn)}\n.aviso.fail{background:var(--fail-soft);border-color:var(--fail)}\n.aviso b{display:block;margin-bottom:2px}\n.lista-check{list-style:none;margin:0;padding:0}\n.lista-check li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px}\n.lista-check li:last-child{border-bottom:0}\n.lista-check .ic{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}\n.lista-check .ic.ok{background:var(--ok-soft);color:var(--ok)}\n.lista-check .ic.warn{background:var(--warn-soft);color:var(--warn)}\n.lista-check .ic.fail{background:var(--fail-soft);color:var(--fail)}\n.lista-check .ic.na{background:var(--paper);color:var(--ink3);border:1px solid var(--line)}\n.lista-check .txt b{display:block;font-size:12.5px}\n.lista-check .txt small{color:var(--ink3);font-size:11px;display:block;margin-top:1px}\n/* ---------- Diversos ---------- */\n.barra{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px}\n.barra .esp{flex:1}\n.mono{font-family:var(--ff-mono)}\n.dim{color:var(--ink3)}\n.nowrap{white-space:nowrap}\ndetails.doc{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--paper2);margin-bottom:9px}\ndetails.doc summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink2)}\ndetails.doc[open] summary{margin-bottom:8px;color:var(--ink)}\ndetails.doc .corpo{font-size:12.5px;color:var(--ink2);line-height:1.55}\ndetails.doc code{font-family:var(--ff-mono);background:var(--paper);padding:1px 4px;border-radius:2px;border:1px solid var(--line2);font-size:11.5px}\n.toast{\n  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;\n  background:var(--ink);color:var(--paper2);padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:600;\n  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;\n}\n.toast.ver{opacity:1;transform:translateX(-50%) translateY(-4px)}\n.rodape{max-width:1400px;margin:0 auto;padding:16px;color:var(--ink3);font-size:11px;border-top:1px solid var(--line2)}\n.eq{font-family:var(--ff-mono);font-size:12px;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;margin:6px 0;overflow-x:auto;white-space:pre}\n@media (max-width:640px){\n  main{padding:14px 10px 56px}\n  .marca .sub{display:none}\n  .topo-in{padding:8px 10px}\n  h2.titulo{font-size:18px}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n@media print{\n  body{background:#fff;background-image:none;font-size:10.5pt}\n  header.topo,nav.pranchas,.topo-acoes,.barra,.naoimprime{display:none!important}\n  .painel[hidden]{display:block!important}\n  .card,.prancha{box-shadow:none;break-inside:avoid;page-break-inside:avoid}\n  main{max-width:none;padding:0}\n  .tabela-rolo{overflow:visible}\n  #perfil{min-width:0;width:100%}\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003c!-- ================= TELA DE ABERTURA ================= --\u003e\n\u003cstyle id=\"ecp-splash-css\"\u003e\n#ecp-splash{position:fixed;inset:0;z-index:99999;background:#07161B;overflow:hidden;\n  font-family:var(--ff-ui,system-ui);opacity:1;transition:opacity .5s ease}\n#ecp-splash.saindo{opacity:0;pointer-events:none}\n#ecp-splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}\n#ecp-splash .vinheta{position:absolute;inset:0;pointer-events:none;\n  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 35%,rgba(3,10,13,.55) 100%)}\n#ecp-splash .scan{position:absolute;inset:0;pointer-events:none;opacity:.16;\n  background:repeating-linear-gradient(0deg,rgba(180,230,240,.10) 0 1px,transparent 1px 3px)}\n.ecp-hud{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(20px,6vw,90px) clamp(28px,7vh,72px);\n  pointer-events:none;color:#E4EEEF}\n.ecp-hud .marcaS{font-size:clamp(30px,5.4vw,64px);font-weight:800;letter-spacing:-1.4px;\n  text-transform:uppercase;line-height:1;opacity:0;transform:translateY(14px);\n  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}\n.ecp-hud .marcaS span{color:#4FB8D8}\n.ecp-hud .subS{margin-top:12px;font-size:clamp(12px,1.35vw,15px);color:#A8C0C5;letter-spacing:.4px;\n  opacity:0;transform:translateY(10px);transition:opacity .7s ease .1s,transform .7s ease .1s}\n.ecp-hud.on .marcaS,.ecp-hud.on .subS{opacity:1;transform:none}\n.ecp-barra{margin-top:26px;max-width:520px;height:2px;background:rgba(168,192,197,.18);position:relative;overflow:hidden}\n.ecp-barra i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,#12718F,#4FB8D8);transition:right .12s linear}\n.ecp-log{margin-top:10px;font-family:var(--ff-mono,monospace);font-size:11px;color:#7C979D;letter-spacing:.5px;\n  text-transform:uppercase;min-height:14px}\n.ecp-selo{position:absolute;top:clamp(18px,4vh,34px);left:clamp(20px,6vw,90px);\n  font-family:var(--ff-mono,monospace);font-size:10.5px;letter-spacing:1.6px;color:#6E8B92;text-transform:uppercase}\n\n/* ---- Aviso legal ---- */\n#ecp-aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\n  padding:24px;background:rgba(5,16,20,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\n  opacity:0;visibility:hidden;transition:opacity .55s ease}\n#ecp-aviso.on{opacity:1;visibility:visible}\n.ecp-card{width:min(720px,100%);max-height:88vh;overflow:auto;background:#0E2126;border:1px solid #23454E;\n  border-radius:4px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9);padding:clamp(22px,3.4vw,38px);\n  transform:translateY(18px) scale(.985);transition:transform .55s cubic-bezier(.2,.7,.2,1)}\n#ecp-aviso.on .ecp-card{transform:none}\n.ecp-card h2{margin:0;font-size:clamp(18px,2.2vw,24px);font-weight:800;letter-spacing:-.4px;color:#E4EEEF}\n.ecp-card .kick{font-family:var(--ff-mono,monospace);font-size:10.5px;letter-spacing:1.8px;color:#4FB8D8;\n  text-transform:uppercase;margin-bottom:10px}\n.ecp-card .regra{height:1px;background:#23454E;margin:20px 0}\n.ecp-card p{margin:0 0 12px;font-size:13.5px;line-height:1.62;color:#A8C0C5;text-wrap:pretty}\n.ecp-card p b{color:#D5E4E6;font-weight:700}\n.ecp-card ul{margin:0 0 14px;padding-left:18px;color:#A8C0C5;font-size:13px;line-height:1.6}\n.ecp-card li{margin-bottom:7px}\n.ecp-aceite{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid #23454E;\n  background:#0A1B20;border-radius:3px;margin-top:4px;cursor:pointer}\n.ecp-aceite input{margin-top:2px;width:16px;height:16px;accent-color:#4FB8D8;cursor:pointer;flex:0 0 auto}\n.ecp-aceite span{font-size:13px;color:#D5E4E6;line-height:1.5}\n.ecp-acoes{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:20px;flex-wrap:wrap}\n.ecp-acoes .nota{margin-right:auto;font-family:var(--ff-mono,monospace);font-size:10.5px;color:#6E8B92;letter-spacing:.6px}\n#ecp-entrar{font-family:inherit;font-size:13px;font-weight:700;padding:10px 20px;border-radius:3px;\n  border:1px solid #12718F;background:#12718F;color:#fff;cursor:pointer;transition:filter .15s,opacity .15s}\n#ecp-entrar:hover{filter:brightness(1.12)}\n#ecp-entrar[disabled]{opacity:.4;cursor:not-allowed;filter:none}\n#ecp-sair{font-family:inherit;font-size:13px;font-weight:600;padding:10px 16px;border-radius:3px;\n  border:1px solid #23454E;background:transparent;color:#A8C0C5;cursor:pointer}\n#ecp-sair:hover{border-color:#3A5A63;color:#D5E4E6}\nhtml.ecp-travado,html.ecp-travado body{overflow:hidden}\n@media (prefers-reduced-motion:reduce){#ecp-splash *{transition-duration:.01ms!important}}\n\u003c/style\u003e\n\u003cdiv id=\"ecp-splash\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Abertura do EsgotoCalc Pro\"\u003e\n  \u003ccanvas id=\"ecp-canvas\"\u003e\u003c/canvas\u003e\n  \u003cdiv class=\"scan\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"vinheta\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"ecp-selo\"\u003eRede coletora · escoamento livre · NBR 9649\u003c/div\u003e\n  \u003cdiv class=\"ecp-hud\" id=\"ecp-hud\"\u003e\n    \u003cdiv class=\"marcaS\"\u003eEsgoto\u003cspan\u003eCalc\u003c/span\u003e Pro\u003c/div\u003e\n    \u003cdiv class=\"subS\"\u003eDimensionamento hidráulico de redes coletoras de esgoto sanitário\u003c/div\u003e\n    \u003cdiv class=\"ecp-barra\"\u003e\u003ci id=\"ecp-prog\"\u003e\u003c/i\u003e\u003c/div\u003e\n    \u003cdiv class=\"ecp-log\" id=\"ecp-log\"\u003einiciando\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv id=\"ecp-aviso\"\u003e\n    \u003cdiv class=\"ecp-card\" role=\"document\"\u003e\n      \u003cdiv class=\"kick\"\u003eAviso legal · leia antes de prosseguir\u003c/div\u003e\n      \u003ch2\u003eTermo de uso e limitação de responsabilidade\u003c/h2\u003e\n      \u003cdiv class=\"regra\"\u003e\u003c/div\u003e\n      \u003cp\u003eO \u003cb\u003eEsgotoCalc Pro\u003c/b\u003e é uma ferramenta de \u003cb\u003eapoio ao cálculo\u003c/b\u003e de redes coletoras de esgoto sanitário. Os resultados apresentados são estimativas obtidas a partir dos dados inseridos pelo usuário e das hipóteses adotadas pelo modelo.\u003c/p\u003e\n      \u003cul\u003e\n        \u003cli\u003eTodo resultado deve ser \u003cb\u003econferido e validado por profissional legalmente habilitado\u003c/b\u003e, com anotação de responsabilidade técnica (ART/RRT).\u003c/li\u003e\n        \u003cli\u003eO uso do software \u003cb\u003enão substitui\u003c/b\u003e a aplicação das normas vigentes (NBR 9649, NBR 12207 e correlatas) nem as exigências da concessionária local.\u003c/li\u003e\n        \u003cli\u003eO software é fornecido \u003cb\u003e“no estado em que se encontra”\u003c/b\u003e, sem garantias de exatidão, adequação a finalidade específica ou ausência de erros.\u003c/li\u003e\n        \u003cli\u003eOs autores e distribuidores \u003cb\u003enão se responsabilizam\u003c/b\u003e por danos diretos ou indiretos decorrentes do uso ou da interpretação dos resultados.\u003c/li\u003e\n        \u003cli\u003eOs dados dos projetos permanecem \u003cb\u003eno seu navegador\u003c/b\u003e; a guarda e o backup são de responsabilidade do usuário.\u003c/li\u003e\n      \u003c/ul\u003e\n      \u003clabel class=\"ecp-aceite\" for=\"ecp-check\"\u003e\n        \u003cinput type=\"checkbox\" id=\"ecp-check\"\u003e\n        \u003cspan\u003eLi e concordo com os termos acima e declaro estar ciente de que a responsabilidade técnica pelo projeto é do profissional habilitado.\u003c/span\u003e\n      \u003c/label\u003e\n      \u003cdiv class=\"ecp-acoes\"\u003e\n        \u003cdiv class=\"nota\"\u003ev1.0 · uso profissional\u003c/div\u003e\n        \u003cbutton id=\"ecp-sair\" type=\"button\"\u003eNão concordo\u003c/button\u003e\n        \u003cbutton id=\"ecp-entrar\" type=\"button\" disabled=\"\"\u003eConcordo e acessar o sistema\u003c/button\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003cheader class=\"topo\"\u003e\n  \u003cdiv class=\"topo-in\"\u003e\n    \u003cdiv class=\"marca\"\u003e\n      \u003cb\u003eEsgoto\u003cspan\u003eCalc\u003c/span\u003e Pro\u003c/b\u003e\n      \u003cspan class=\"ver\" id=\"verTag\"\u003ev1.0\u003c/span\u003e\n      \u003cspan class=\"sub\"\u003eRedes coletoras de esgoto sanitário — NBR 9649 / NBR 14486\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"topo-acoes\"\u003e\n      \u003cbutton id=\"btSalvar\" title=\"Grava o projeto no navegador\"\u003eSalvar\u003c/button\u003e\n      \u003cbutton id=\"btExportar\" title=\"Baixa um arquivo .json com o projeto\"\u003eExportar\u003c/button\u003e\n      \u003cbutton id=\"btImportar\" title=\"Carrega um projeto .json\"\u003eImportar\u003c/button\u003e\n      \u003cinput type=\"file\" id=\"arqImport\" accept=\".json,application/json\" hidden=\"\"\u003e\n      \u003cbutton id=\"btImprimir\"\u003eImprimir\u003c/button\u003e\n      \u003cbutton id=\"btTema\" title=\"Alterna claro/escuro\"\u003eTema\u003c/button\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\n\u003cnav class=\"pranchas\" aria-label=\"Etapas do projeto\"\u003e\n  \u003cdiv class=\"pranchas-in\" role=\"tablist\"\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pProjeto\" aria-selected=\"true\"\u003e\u003cspan class=\"num\"\u003e01\u003c/span\u003eProjeto\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pVazoes\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e02\u003c/span\u003eVazões\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pTrecho\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e03\u003c/span\u003eTrecho\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pRede\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e04\u003c/span\u003eRede e perfil\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pEstrutural\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e05\u003c/span\u003eEstrutural\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pVala\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e06\u003c/span\u003eVala e quantitativos\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pOrcamento\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e07\u003c/span\u003eOrçamento SINAPI\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pMateriais\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e08\u003c/span\u003eMateriais\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pConformidade\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e09\u003c/span\u003eConformidade\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pRelatorio\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e10\u003c/span\u003eRelatório\u003c/button\u003e\n    \u003cbutton class=\"aba\" role=\"tab\" data-alvo=\"pTestes\" aria-selected=\"false\"\u003e\u003cspan class=\"num\"\u003e11\u003c/span\u003eTestes\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/nav\u003e\n\n\u003cmain\u003e\n\n\u003c!-- ============ 01 PROJETO ============ --\u003e\n\u003csection class=\"painel\" id=\"pProjeto\" role=\"tabpanel\"\u003e\n  \u003ch2 class=\"titulo\"\u003eParâmetros do projeto\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eDefina identificação, população, consumo e critérios normativos. Todos os demais módulos leem daqui.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eIdentificação \u003cspan class=\"tag\"\u003ecabeçalho do relatório\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"campo\"\u003e\u003clabel\u003eObra / empreendimento\u003c/label\u003e\u003cinput id=\"idObra\" placeholder=\"Ex.: Ampliação do SES — Bairro Jardim Norte\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eMunicípio / UF\u003c/label\u003e\u003cinput id=\"idMunicipio\" placeholder=\"Ex.: Brasília / DF\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eContratante\u003c/label\u003e\u003cinput id=\"idContratante\" placeholder=\"Ex.: Companhia de Saneamento\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eResponsável técnico\u003c/label\u003e\u003cinput id=\"idRT\" placeholder=\"Nome\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eCREA / ART\u003c/label\u003e\u003cinput id=\"idCrea\" placeholder=\"Nº\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eData do estudo\u003c/label\u003e\u003cinput id=\"idData\" placeholder=\"dd/mm/aaaa\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eRevisão\u003c/label\u003e\u003cinput id=\"idRev\" placeholder=\"R00\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003ePopulação e consumo \u003cspan class=\"tag\"\u003eNBR 9649 item 5.1\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003ePopulação início de plano \u003cspan class=\"un\"\u003ehab\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"popI\" value=\"4500\" step=\"1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003ePopulação fim de plano \u003cspan class=\"un\"\u003ehab\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"popF\" value=\"8200\" step=\"1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eConsumo per capita início \u003cspan class=\"un\"\u003eL/hab·dia\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"qpcI\" value=\"150\" step=\"1\" min=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eConsumo per capita fim \u003cspan class=\"un\"\u003eL/hab·dia\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"qpcF\" value=\"180\" step=\"1\" min=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eCoeficiente de retorno C \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"coefC\" value=\"0.80\" step=\"0.01\" min=\"0.1\" max=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eK1 — dia de maior consumo \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"k1\" value=\"1.20\" step=\"0.01\" min=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eK2 — hora de maior consumo \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"k2\" value=\"1.50\" step=\"0.01\" min=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eK3 — hora de menor consumo \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"k3\" value=\"0.50\" step=\"0.01\" min=\"0.1\" max=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eTaxa de infiltração \u003cspan class=\"un\"\u003eL/s·km\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"txInf\" value=\"0.10\" step=\"0.01\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eExtensão total da rede \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"extRede\" value=\"6200\" step=\"1\" min=\"1\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"ajuda\"\u003eA extensão total é usada para converter a vazão da bacia em \u003cb\u003etaxa de contribuição linear\u003c/b\u003e (L/s·m), distribuída trecho a trecho.\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eCritérios hidráulicos \u003cspan class=\"tag\"\u003eNBR 9649:1986\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eVazão mínima de projeto \u003cspan class=\"un\"\u003eL/s\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"qMin\" value=\"1.5\" step=\"0.1\" min=\"0.1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eTensão trativa mínima \u003cspan class=\"un\"\u003ePa\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"ttMin\" value=\"1.0\" step=\"0.1\" min=\"0.1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eLâmina relativa máxima Y/D \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"ydMax\" value=\"0.75\" step=\"0.01\" min=\"0.3\" max=\"0.9\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eY/D máx. se V\u003csub\u003ef\u003c/sub\u003e \u0026gt; V\u003csub\u003ec\u003c/sub\u003e \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"ydCrit\" value=\"0.50\" step=\"0.01\" min=\"0.3\" max=\"0.9\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eVelocidade máxima \u003cspan class=\"un\"\u003em/s\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"vMax\" value=\"5.0\" step=\"0.1\" min=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003en de Manning (verificação) \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"nNorma\" value=\"0.013\" step=\"0.001\" min=\"0.008\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003ePeso específico do esgoto \u003cspan class=\"un\"\u003eN/m³\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"gamaAgua\" value=\"10000\" step=\"10\" min=\"9000\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDiâmetro mínimo da rede \u003cspan class=\"un\"\u003emm\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"dnMin\" value=\"150\" step=\"10\" min=\"100\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003clabel class=\"ck\"\u003e\u003cinput type=\"checkbox\" id=\"usarNnorma\" checked=\"\"\u003e Usar n = 0,013 para todos os materiais na verificação normativa\u003c/label\u003e\n      \u003cdiv class=\"ajuda\"\u003eA NBR 9649 fixa n = 0,013 independentemente do material para a verificação hidráulica. O n do catálogo entra apenas na aba comparativa.\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eAssentamento \u003cspan class=\"tag\"\u003erecobrimento e vala\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eRecobrimento mín. no leito da via \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"recVia\" value=\"0.90\" step=\"0.05\" min=\"0.3\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eRecobrimento mín. no passeio \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"recPasseio\" value=\"0.65\" step=\"0.05\" min=\"0.3\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eProfundidade máxima recomendada \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"profMax\" value=\"4.00\" step=\"0.1\" min=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDistância máxima entre PVs \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"distPV\" value=\"100\" step=\"5\" min=\"20\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eFolga lateral na vala (cada lado) \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"folgaVala\" value=\"0.30\" step=\"0.05\" min=\"0.1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eLargura mínima de vala \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"valaMin\" value=\"0.60\" step=\"0.05\" min=\"0.4\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eEspessura do berço/lastro \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"berco\" value=\"0.10\" step=\"0.01\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eNível d\u0027água (prof. do NA) \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"profNA\" value=\"0\" step=\"0.1\" min=\"0\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003clabel class=\"ck\"\u003e\u003cinput type=\"checkbox\" id=\"valaABNT\" checked=\"\"\u003e Adotar a largura de vala tabelada na NBR 17015:2023\u003c/label\u003e\n      \u003cdiv class=\"ajuda\"\u003eCom a opção marcada, a largura vem da tabela normativa, em função do diâmetro nominal, da faixa de cota de corte (0–2, 2–4, 4–6 e 6–8 m) e do tipo de escoramento. Desmarcada, vale o critério paramétrico DE + 2·folga com a folga fixa informada acima. Profundidade do NA = 0 significa lençol não considerado.\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n  \u003ch3 class=\"titulo\" style=\"font-size:15px\"\u003eSíntese hidráulica do projeto\u003c/h3\u003e\n  \u003cp class=\"lede\"\u003eRecalculada a cada alteração de população, consumo, coeficientes ou critérios normativos.\u003c/p\u003e\n  \u003cdiv class=\"grade g4\" id=\"kpiProjeto\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"grade g2\" style=\"margin-top:12px\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eVazões e contribuição linear\u003c/h3\u003e\n      \u003cdiv class=\"res\" id=\"resSintese\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eConsequências sobre o dimensionamento\u003c/h3\u003e\n      \u003cdiv class=\"res\" id=\"resSinteseDim\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"ajuda\" style=\"margin-top:8px\"\u003eO diâmetro mínimo compatível é o menor DN de PVC que escoa a vazão de fim de plano dentro da lâmina limite adotando a declividade mínima de tensão trativa. Serve como piso de referência: em rede real o DN por trecho depende da vazão acumulada de cada bacia.\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"barra\" style=\"margin-top:14px\"\u003e\n    \u003cbutton class=\"pri\" id=\"btExemplo\"\u003eCarregar exemplo\u003c/button\u003e\n    \u003cbutton id=\"btLimpar\" class=\"danger\"\u003eLimpar projeto\u003c/button\u003e\n    \u003cspan class=\"esp\"\u003e\u003c/span\u003e\n    \u003cspan class=\"dim mono\" id=\"statusSalvo\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 02 VAZÕES ============ --\u003e\n\u003csection class=\"painel\" id=\"pVazoes\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eVazões de contribuição\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eVazão doméstica de início e fim de plano, infiltração, contribuições concentradas e parcela pluvial parasitária pelo método racional.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g4\" id=\"kpiVazoes\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eMemória de cálculo — vazão doméstica\u003c/h3\u003e\n      \u003cdiv class=\"eq\"\u003eQi = (C · Pi · qi · K2) / 86 400        [L/s]\nQf = (C · Pf · qf · K1 · K2) / 86 400   [L/s]\u003c/div\u003e\n      \u003cdiv class=\"res\" id=\"resDomestica\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"ajuda\" style=\"margin-top:8px\"\u003eO início de plano usa apenas K2 (hora de maior consumo do ano inicial); o fim de plano acumula K1 · K2.\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eContribuições concentradas \u003cspan class=\"tag\"\u003egrandes geradores\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"barra\"\u003e\u003cbutton class=\"mini pri\" id=\"btAddConc\"\u003eAdicionar contribuinte\u003c/button\u003e\u003cspan class=\"esp\"\u003e\u003c/span\u003e\u003cspan class=\"dim mono\" id=\"totConc\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tabela-rolo\"\u003e\n        \u003ctable\u003e\n          \u003cthead\u003e\u003ctr\u003e\u003cth class=\"esq\"\u003eIdentificação\u003c/th\u003e\u003cth\u003eVazão início\u003cbr\u003eL/s\u003c/th\u003e\u003cth\u003eVazão fim\u003cbr\u003eL/s\u003c/th\u003e\u003cth\u003eNó de lançamento\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n          \u003ctbody id=\"tbConc\"\u003e\u003c/tbody\u003e\n        \u003c/table\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"ajuda\" style=\"margin-top:8px\"\u003eHospitais, indústrias, escolas e presídios devem entrar como vazão concentrada no nó correspondente, não diluídos na taxa linear.\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eInfiltração \u003cspan class=\"tag\"\u003eNBR 9649 item 5.1.4\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"res\" id=\"resInfiltracao\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"ajuda\" style=\"margin-top:8px\"\u003eFaixa usual de 0,05 a 1,00 L/s·km, função do tipo de tubo, junta, nível do lençol e idade da rede.\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eParcela pluvial parasitária \u003cspan class=\"tag\"\u003emétodo racional\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eÁrea da microbacia \u003cspan class=\"un\"\u003eha\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"racA\" value=\"12.5\" step=\"0.1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eCoeficiente de escoamento C \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"racC\" value=\"0.05\" step=\"0.01\" min=\"0\" max=\"1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eIntensidade de chuva i \u003cspan class=\"un\"\u003emm/h\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"racI\" value=\"60\" step=\"1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eFração que atinge a rede \u003cspan class=\"un\"\u003e%\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"racFrac\" value=\"100\" step=\"1\" min=\"0\" max=\"100\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"eq\"\u003eQ = C · i · A / 360   [m³/s]   com A em ha, i em mm/h\u003c/div\u003e\n      \u003cdiv class=\"res\" id=\"resRacional\"\u003e\u003c/div\u003e\n      \u003clabel class=\"ck\" style=\"margin-top:8px\"\u003e\u003cinput type=\"checkbox\" id=\"racNaRede\"\u003e Somar esta parcela às vazões de fim de plano da rede\u003c/label\u003e\n      \u003cdiv class=\"aviso warn\" style=\"margin-top:9px\"\u003e\u003cb\u003eAtenção\u003c/b\u003e Em sistema separador absoluto a contribuição pluvial é indevida. Use C baixo (0,02 a 0,10) apenas para estimar o extravasamento causado por ligações clandestinas e verificar a capacidade remanescente.\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 03 TRECHO ============ --\u003e\n\u003csection class=\"painel\" id=\"pTrecho\" role=\"tabpanel\"\u003e\n  \u003ch2 class=\"titulo\"\u003eDimensionamento de trecho\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eVerificação hidráulica de um trecho isolado e busca automática do menor diâmetro e da menor declividade que atendem à norma.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eDados de entrada\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eMaterial\u003c/label\u003e\u003cselect id=\"tMat\"\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDiâmetro nominal\u003c/label\u003e\u003cselect id=\"tDN\"\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eVazão de início de plano Q\u003csub\u003ei\u003c/sub\u003e \u003cspan class=\"un\"\u003eL/s\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"tQi\" value=\"1.5\" step=\"0.1\" min=\"0.01\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eVazão de fim de plano Q\u003csub\u003ef\u003c/sub\u003e \u003cspan class=\"un\"\u003eL/s\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"tQf\" value=\"12\" step=\"0.1\" min=\"0.01\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDeclividade I \u003cspan class=\"un\"\u003em/m\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"tI\" value=\"0.0060\" step=\"0.0001\" min=\"0.0001\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eExtensão do trecho \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"tL\" value=\"80\" step=\"1\" min=\"1\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"barra\" style=\"margin-top:6px\"\u003e\n        \u003cbutton class=\"pri\" id=\"btDimensionar\"\u003eDimensionar automaticamente\u003c/button\u003e\n        \u003cbutton id=\"btIminima\"\u003eAplicar declividade mínima\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"ajuda\"\u003eA declividade informada é lida como a \u003cb\u003edeclividade disponível do terreno\u003c/b\u003e. O dimensionamento adota o menor diâmetro comercial que atende à tensão trativa, à lâmina e à velocidade \u003cb\u003ecom essa declividade\u003c/b\u003e, mantendo a profundidade de vala constante. Só quando nenhum diâmetro atende é que a declividade sobe acima da do terreno e a vala aprofunda.\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eVerificações \u003cspan class=\"tag\" id=\"tSelo\"\u003e\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:9px\"\u003e\n        \u003cdiv class=\"kpi\" id=\"kTT\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"kpi\" id=\"kYD\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"kpi\" id=\"kV\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"kpi\" id=\"kI\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"res\" id=\"resTrecho\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eSeção transversal \u003cspan class=\"tag\"\u003elâmina d\u0027água\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv id=\"secaoBox\" style=\"display:grid;place-items:center;padding:6px\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eCurva de capacidade \u003cspan class=\"tag\"\u003eQ e V em função de Y/D\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv id=\"curvaBox\" style=\"overflow:auto\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdetails class=\"doc\" style=\"margin-top:14px\"\u003e\n    \u003csummary\u003eFormulação empregada\u003c/summary\u003e\n    \u003cdiv class=\"corpo\"\u003e\n      \u003cdiv class=\"eq\"\u003eθ = 2 · arccos(1 − 2·Y/D)\nA = (D²/8) · (θ − sen θ)\nP = θ · D / 2\nRh = A / P = (D/4) · (1 − sen θ / θ)\nQ = (1/n) · A · Rh^(2/3) · I^(1/2)     (Manning)\nσt = γ · Rh · I                        (tensão trativa média)\nVc = 6 · √(g · Rh)                     (velocidade crítica)\nImin = 0,0055 · Qi^(−0,47)             (Qi em L/s, σt = 1,0 Pa)\nImax = 4,65 · Qf^(−0,67)               (Qf em L/s, V = 5 m/s)\u003c/div\u003e\n      \u003cp\u003eA lâmina relativa é obtida por bisseção no intervalo Y/D ∈ (0 ; 0,93], região em que a vazão é estritamente crescente. Acima de Y/D ≈ 0,938 a vazão volta a decrescer e a solução deixa de ser única — por isso o limite normativo de 0,75 é também uma proteção contra instabilidade de escoamento.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/details\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 04 REDE ============ --\u003e\n\u003csection class=\"painel\" id=\"pRede\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eRede coletora — cálculo trecho a trecho\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eCada linha é um trecho entre dois poços de visita. As cotas de fundo são encadeadas de montante para jusante, respeitando recobrimento mínimo e degraus nos PVs.\u003c/p\u003e\n\n  \u003cdiv class=\"barra\"\u003e\n    \u003cbutton class=\"pri\" id=\"btAddTrecho\"\u003eAdicionar trecho\u003c/button\u003e\n    \u003cbutton id=\"btDimRede\"\u003eDimensionar rede inteira\u003c/button\u003e\n    \u003cbutton id=\"btRecalcular\"\u003eRecalcular\u003c/button\u003e\n    \u003cbutton id=\"btCsvRede\"\u003eExportar CSV\u003c/button\u003e\n    \u003cspan class=\"esp\"\u003e\u003c/span\u003e\n    \u003cspan id=\"seloRede\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"tabela-rolo\" style=\"max-height:none\"\u003e\n    \u003ctable id=\"tabRede\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth class=\"esq\"\u003ePV mont.\u003c/th\u003e\u003cth class=\"esq\"\u003ePV jus.\u003c/th\u003e\n          \u003cth\u003eL\u003cbr\u003em\u003c/th\u003e\n          \u003cth\u003eCota terr.\u003cbr\u003emont.\u003c/th\u003e\u003cth\u003eCota terr.\u003cbr\u003ejus.\u003c/th\u003e\n          \u003cth class=\"esq\"\u003eMaterial\u003c/th\u003e\u003cth\u003eDN\u003cbr\u003emm\u003c/th\u003e\u003cth\u003eI\u003cbr\u003em/m\u003c/th\u003e\n          \u003cth\u003eI real\u003cbr\u003em/km\u003c/th\u003e\n          \u003cth\u003eQ\u003csub\u003ei\u003c/sub\u003e\u003cbr\u003eL/s\u003c/th\u003e\u003cth\u003eQ\u003csub\u003ef\u003c/sub\u003e\u003cbr\u003eL/s\u003c/th\u003e\n          \u003cth\u003eY/D\u003csub\u003ef\u003c/sub\u003e\u003c/th\u003e\u003cth\u003eV\u003csub\u003ef\u003c/sub\u003e\u003cbr\u003em/s\u003c/th\u003e\u003cth\u003eσt\u003csub\u003ei\u003c/sub\u003e\u003cbr\u003ePa\u003c/th\u003e\n          \u003cth\u003eCota fundo\u003cbr\u003emont.\u003c/th\u003e\u003cth\u003eCota fundo\u003cbr\u003ejus.\u003c/th\u003e\n          \u003cth\u003eProf.\u003cbr\u003emont.\u003c/th\u003e\u003cth\u003eProf.\u003cbr\u003ejus.\u003c/th\u003e\n          \u003cth class=\"esq\"\u003eSituação\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody id=\"tbRede\"\u003e\u003c/tbody\u003e\n      \u003ccaption\u003eQ\u003csub\u003ei\u003c/sub\u003e e Q\u003csub\u003ef\u003c/sub\u003e são vazões acumuladas de jusante do trecho, incluindo taxa linear, infiltração e contribuições concentradas a montante.\u003c/caption\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"prancha\" id=\"pranchaPerfil\"\u003e\n    \u003cdiv class=\"prancha-cab\"\u003e\n      \u003cspan\u003ePerfil longitudinal — \u003cb id=\"perfilTitulo\"\u003erede principal\u003c/b\u003e\u003c/span\u003e\n      \u003cspan\u003eEscala vertical exagerada \u003cb id=\"perfilExag\"\u003e10×\u003c/b\u003e\u003c/span\u003e\n      \u003cspan class=\"naoimprime\" style=\"display:flex;gap:12px;align-items:center\"\u003e\n        \u003clabel class=\"ck\" style=\"margin:0;display:inline-flex\"\u003e\u003cinput type=\"checkbox\" id=\"perfilLamina\" checked=\"\"\u003e lâmina d\u0027água\u003c/label\u003e\n        \u003cselect id=\"perfilModo\" style=\"width:auto;padding:2px 6px;font-size:11px\"\u003e\n          \u003coption value=\"cota\"\u003ecotas absolutas\u003c/option\u003e\n          \u003coption value=\"prof\"\u003eprofundidade da vala\u003c/option\u003e\n        \u003c/select\u003e\n      \u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"perfilBox\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"grade g4\" id=\"kpiRede\" style=\"margin-top:14px\"\u003e\u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 05 ESTRUTURAL ============ --\u003e\n\u003csection class=\"painel\" id=\"pEstrutural\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eVerificação estrutural do tubo enterrado\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eCarga de solo, carga móvel e deflexão diametral pela fórmula de Iowa modificada (Spangler) para tubos flexíveis — PVC e PEAD — e carga admissível para tubos rígidos.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eCondições de instalação\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eMaterial\u003c/label\u003e\u003cselect id=\"eMat\"\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDiâmetro nominal\u003c/label\u003e\u003cselect id=\"eDN\"\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eRigidez anelar SN \u003cspan class=\"un\"\u003ekN/m²\u003c/span\u003e\u003c/label\u003e\u003cselect id=\"eSN\"\u003e\u003coption\u003e2\u003c/option\u003e\u003coption selected=\"\"\u003e4\u003c/option\u003e\u003coption\u003e8\u003c/option\u003e\u003coption\u003e16\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eAltura de recobrimento H \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"eH\" value=\"2.00\" step=\"0.05\" min=\"0.2\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003ePeso específico do solo \u003cspan class=\"un\"\u003ekN/m³\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"eGama\" value=\"18\" step=\"0.5\" min=\"10\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eMódulo de reação do solo E\u0027 \u003cspan class=\"un\"\u003ekPa\u003c/span\u003e\u003c/label\u003e\u003cselect id=\"eEl\"\u003e\n          \u003coption value=\"1400\"\u003eSolo fino, sem compactação — 1 400\u003c/option\u003e\n          \u003coption value=\"2800\"\u003eCompactação leve (\u0026lt;85% Proctor) — 2 800\u003c/option\u003e\n          \u003coption value=\"7000\" selected=\"\"\u003eCompactação moderada (85–95%) — 7 000\u003c/option\u003e\n          \u003coption value=\"14000\"\u003eCompactação alta (\u0026gt;95%) — 14 000\u003c/option\u003e\n          \u003coption value=\"20000\"\u003eBrita graduada compactada — 20 000\u003c/option\u003e\n        \u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eFator de recalque D\u003csub\u003eL\u003c/sub\u003e \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"eDL\" value=\"1.25\" step=\"0.05\" min=\"1\" max=\"2\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eFator de berço K\u003csub\u003ex\u003c/sub\u003e \u003cspan class=\"un\"\u003e—\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"eKx\" value=\"0.10\" step=\"0.005\" min=\"0.08\" max=\"0.11\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eCarga de roda \u003cspan class=\"un\"\u003ekN\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"eP\" value=\"75\" step=\"5\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDeflexão admissível \u003cspan class=\"un\"\u003e%\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"eDefAdm\" value=\"5.0\" step=\"0.5\" min=\"1\" max=\"10\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003clabel class=\"ck\"\u003e\u003cinput type=\"checkbox\" id=\"eTrafego\" checked=\"\"\u003e Considerar carga móvel rodoviária (TB-450, roda isolada)\u003c/label\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eResultados \u003cspan class=\"tag\" id=\"eSelo\"\u003e\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:9px\"\u003e\n        \u003cdiv class=\"kpi\" id=\"eK1\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"kpi\" id=\"eK2\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"kpi\" id=\"eK3\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"kpi\" id=\"eK4\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"res\" id=\"eRes\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"card\"\u003e\n    \u003ch3\u003eDeflexão em função do recobrimento\u003c/h3\u003e\n    \u003cdiv id=\"eGrafico\" style=\"overflow:auto\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdetails class=\"doc\" style=\"margin-top:14px\"\u003e\n    \u003csummary\u003eFormulação estrutural\u003c/summary\u003e\n    \u003cdiv class=\"corpo\"\u003e\n      \u003cdiv class=\"eq\"\u003eCarga de solo (prisma, tubo flexível):   qs = γs · H            [kPa]\nCarga móvel (Boussinesq, r = 0):        qm = 3·P·If / (2·π·H²)  [kPa]\nRigidez do tubo:                        PS = 6,7 · SN           [kPa]\nDeflexão (Iowa modificada):\n  Δy/D = DL · Kx · (qs + qm) / (0,149·PS + 0,061·E\u0027)\u003c/div\u003e\n      \u003cp\u003ePara tubos flexíveis (PVC e PEAD) a hipótese de prisma de solo é a usual e conservadora: o tubo deforma mais que o solo lateral, transferindo carga para as laterais. O critério de aceitação é a deflexão de longo prazo, limitada a 5% do diâmetro — muitos fabricantes de PEAD corrugado recomendam 3% como meta de projeto. O fator de impacto \u003ccode\u003eIf\u003c/code\u003e adotado decresce de 1,50 (H ≤ 0,6 m) até 1,00 (H ≥ 2,0 m).\u003c/p\u003e\n      \u003cp\u003ePara tubos rígidos de concreto o programa apresenta a carga vertical por metro linear, que deve ser comparada com a classe de resistência do tubo (carga mínima isenta de fissura), conforme catálogo do fabricante e a NBR 8890, aplicando o fator de equivalência do berço adotado.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/details\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 06 VALA ============ --\u003e\n\u003csection class=\"painel\" id=\"pVala\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eVala, escoramento e quantitativos\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eVolumes de escavação, reaterro e material importado por trecho, tipo de escoramento exigido pela profundidade e planilha de custos com preços unitários editáveis.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g4\" id=\"kpiVala\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"tabela-rolo\"\u003e\n    \u003ctable\u003e\n      \u003cthead\u003e\u003ctr\u003e\n        \u003cth class=\"esq\"\u003eTrecho\u003c/th\u003e\u003cth\u003eL\u003cbr\u003em\u003c/th\u003e\u003cth\u003eProf. média\u003cbr\u003em\u003c/th\u003e\u003cth\u003eLargura\u003cbr\u003em\u003c/th\u003e\n        \u003cth\u003eEscavação\u003cbr\u003em³\u003c/th\u003e\u003cth\u003eBerço\u003cbr\u003em³\u003c/th\u003e\u003cth\u003eTubo\u003cbr\u003em³\u003c/th\u003e\u003cth\u003eReaterro\u003cbr\u003em³\u003c/th\u003e\n        \u003cth\u003eEscoramento\u003cbr\u003em²\u003c/th\u003e\u003cth\u003eEsgotamento\u003cbr\u003em\u003c/th\u003e\u003cth class=\"esq\"\u003eTipo de escoramento\u003c/th\u003e\n      \u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody id=\"tbVala\"\u003e\u003c/tbody\u003e\n      \u003ccaption\u003eLargura da vala obtida da tabela da NBR 17015:2023, cruzando diâmetro nominal, faixa de cota de corte e tipo de escoramento.\u003c/caption\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"card\"\u003e\n    \u003ch3\u003eLargura da vala \u003cspan class=\"tag\"\u003eNBR 17015:2023\u003c/span\u003e\u003c/h3\u003e\n    \u003cdiv class=\"res\" id=\"resValaNorma\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"ajuda\" style=\"margin-top:8px\"\u003eA largura é lida diretamente da tabela normativa, cruzando a faixa de diâmetro nominal, a faixa de cota de corte (0–2, 2–4, 4–6 e 6–8 m) e o tipo de escoramento adotado. Os quantitativos da aba 07 usam exatamente esses valores.\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 07 ORÇAMENTO SINAPI ============ --\u003e\n\u003csection class=\"painel\" id=\"pOrcamento\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eOrçamento com correlação automática ao SINAPI\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eCada quantitativo geométrico da aba 06 é correlacionado à família de composições SINAPI correspondente. Entre as alternativas tecnicamente compatíveis, o sistema adota sempre a de menor custo — e mantém as demais visíveis para auditoria da escolha.\u003c/p\u003e\n\n  \u003cdiv class=\"aviso info\" id=\"orcFonte\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eCondições da obra \u003cspan class=\"tag\"\u003edefinem as composições compatíveis\u003c/span\u003e\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eEncargos sociais\u003c/label\u003e\u003cselect id=\"orcDeson\"\u003e\u003coption value=\"sem\"\u003eSem desoneração\u003c/option\u003e\u003coption value=\"com\"\u003eCom desoneração\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eCategoria do solo\u003c/label\u003e\u003cselect id=\"orcSolo\"\u003e\u003coption value=\"1a\"\u003e1ª categoria\u003c/option\u003e\u003coption value=\"2a\"\u003e2ª categoria\u003c/option\u003e\u003coption value=\"mole\"\u003eSolo mole\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eNível de interferência\u003c/label\u003e\u003cselect id=\"orcInterf\"\u003e\u003coption value=\"baixo\"\u003eBaixo\u003c/option\u003e\u003coption value=\"alto\"\u003eAlto\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eMaterial do berço\u003c/label\u003e\u003cselect id=\"orcBerco\"\u003e\u003coption value=\"areia\"\u003eAreia\u003c/option\u003e\u003coption value=\"brita\"\u003eBrita\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eCompactação do reaterro\u003c/label\u003e\u003cselect id=\"orcCompact\"\u003e\u003coption value=\"placa\"\u003ePlaca vibratória\u003c/option\u003e\u003coption value=\"percussao\"\u003eCompactador de percussão\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eMaterial do poço de visita\u003c/label\u003e\u003cselect id=\"orcPVmat\"\u003e\u003coption value=\"auto\"\u003eMais econômico\u003c/option\u003e\u003coption value=\"concreto\"\u003eConcreto pré-moldado\u003c/option\u003e\u003coption value=\"alv_tijolo\"\u003eAlvenaria de tijolo maciço\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003clabel class=\"ck\"\u003e\u003cinput type=\"checkbox\" id=\"orcEscSemMat\"\u003e Admitir escoramento sem fornecimento de material (blindagem locada)\u003c/label\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003ePavimentação e transporte\u003c/h3\u003e\n      \u003cdiv class=\"grade g2\" style=\"gap:0 12px\"\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003ePavimento existente\u003c/label\u003e\u003cselect id=\"orcPavim\"\u003e\u003coption value=\"nenhum\"\u003eSem pavimento\u003c/option\u003e\u003coption value=\"asfalto\"\u003eAsfáltico\u003c/option\u003e\u003coption value=\"paralelepipedo\"\u003eParalelepípedo\u003c/option\u003e\u003coption value=\"intertravado\"\u003eIntertravado\u003c/option\u003e\u003coption value=\"poliedrica\"\u003ePedra poliédrica\u003c/option\u003e\u003coption value=\"concreto\"\u003eConcreto\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eSobrelargura de demolição (cada lado) \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"or
