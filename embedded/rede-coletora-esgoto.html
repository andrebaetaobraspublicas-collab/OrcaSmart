cSobre\" value=\"0.15\" step=\"0.05\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eEspessura do revestimento \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcEspPav\" value=\"0.05\" step=\"0.01\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eEspessura de base e sub-base \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcEspBase\" value=\"0.20\" step=\"0.01\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eEmpolamento do excedente \u003cspan class=\"un\"\u003e%\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcEmpol\" value=\"25\" step=\"1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eDMT até o bota-fora \u003cspan class=\"un\"\u003ekm\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcDMT\" value=\"15\" step=\"0.5\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eLigações prediais \u003cspan class=\"un\"\u003eun\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcLig\" value=\"0\" step=\"1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eComprimento médio da ligação \u003cspan class=\"un\"\u003em\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcCompLig\" value=\"6\" step=\"0.5\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eEsgotamento de vala \u003cspan class=\"un\"\u003eh/m\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcHEsg\" value=\"0.5\" step=\"0.1\" min=\"0\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"campo\"\u003e\u003clabel\u003eBDI \u003cspan class=\"un\"\u003e%\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"orcBDI\" value=\"22.5\" step=\"0.1\" min=\"0\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"grade g4\" id=\"kpiOrc\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"barra\" style=\"margin-top:12px\"\u003e\n    \u003cbutton class=\"pri\" id=\"btOrcar\"\u003eRecalcular orçamento\u003c/button\u003e\n    \u003cbutton id=\"btCsvOrc\"\u003eExportar planilha CSV\u003c/button\u003e\n    \u003cspan class=\"esp\"\u003e\u003c/span\u003e\n    \u003cspan id=\"seloOrc\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\n  \u003cdiv id=\"orcAvisos\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"tabela-rolo\" style=\"margin-top:10px\"\u003e\n    \u003ctable\u003e\n      \u003cthead\u003e\u003ctr\u003e\n        \u003cth style=\"width:30px\"\u003e\u003c/th\u003e\u003cth class=\"esq\"\u003eServiço\u003c/th\u003e\u003cth class=\"esq\"\u003eCódigo\u003cbr\u003eSINAPI\u003c/th\u003e\u003cth class=\"esq\"\u003eUn\u003c/th\u003e\n        \u003cth\u003eQuantidade\u003c/th\u003e\u003cth\u003eCusto unit.\u003cbr\u003eR$\u003c/th\u003e\u003cth\u003eTotal sem BDI\u003cbr\u003eR$\u003c/th\u003e\u003cth\u003eTotal com BDI\u003cbr\u003eR$\u003c/th\u003e\n      \u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody id=\"tbOrcS\"\u003e\u003c/tbody\u003e\n      \u003ctfoot\u003e\u003ctr id=\"orcTotalS\"\u003e\u003c/tr\u003e\u003c/tfoot\u003e\n      \u003ccaption\u003eClique na seta para ver as demais composições compatíveis e o custo de cada uma. A composição adotada é sempre a de menor custo entre elas.\u003c/caption\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003cdetails class=\"doc\" style=\"margin-top:14px\"\u003e\n    \u003csummary\u003eComo a correlação é feita\u003c/summary\u003e\n    \u003cdiv class=\"corpo\"\u003e\n      \u003cp\u003eCada família de serviço tem um conjunto de atributos extraídos da descrição oficial das composições. A seleção filtra as composições cujos atributos são compatíveis com a geometria do trecho e com as condições declaradas da obra, e ordena o resultado por custo.\u003c/p\u003e\n      \u003cdiv class=\"eq\"\u003eEscavação    → faixa de profundidade × faixa de largura × solo × interferência × equipamento\nEscoramento  → tipo igual ou mais robusto que o exigido × faixa de profundidade × faixa de largura\nFundo/berço  → faixa de largura × material (areia ou brita) × lançamento manual ou mecanizado\nReaterro     → faixa de profundidade × faixa de largura × equipamento × compactação\nTubulação    → material × diâmetro nominal × interferência\nPoço de visita → diâmetro interno em função do DN e da profundidade; base + acréscimo + tampão\nPavimento    → demolição e recomposição por tipo, sobre a largura da vala acrescida da sobrelargura\u003c/div\u003e\n      \u003cp\u003eQuando o SINAPI não oferece composição de fornecimento para um diâmetro específico, o sistema adota a composição de assentamento e registra a ressalva na planilha, em vez de silenciar a lacuna.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/details\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 08 MATERIAIS ============ --\u003e\n\u003csection class=\"painel\" id=\"pMateriais\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eBiblioteca de tubos\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eDiâmetros comerciais, rugosidade e características de cada material. Valores de referência para anteprojeto — confirme sempre no catálogo do fabricante antes da especificação final.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g3\" id=\"cardsMat\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"card\"\u003e\n    \u003ch3\u003eComparativo de capacidade \u003cspan class=\"tag\"\u003emesma declividade, Y/D = 0,75\u003c/span\u003e\u003c/h3\u003e\n    \u003cdiv class=\"barra\"\u003e\n      \u003cdiv class=\"campo\" style=\"margin:0;max-width:170px\"\u003e\u003clabel\u003eDeclividade \u003cspan class=\"un\"\u003em/m\u003c/span\u003e\u003c/label\u003e\u003cinput type=\"number\" id=\"cmpI\" value=\"0.0050\" step=\"0.0005\" min=\"0.0005\"\u003e\u003c/div\u003e\n      \u003clabel class=\"ck\" style=\"margin:0\"\u003e\u003cinput type=\"checkbox\" id=\"cmpNcat\" checked=\"\"\u003e usar n de catálogo (desmarcado: n = 0,013)\u003c/label\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"tabela-rolo\"\u003e\n      \u003ctable\u003e\n        \u003cthead\u003e\u003ctr\u003e\u003cth class=\"esq\"\u003eMaterial\u003c/th\u003e\u003cth\u003en\u003c/th\u003e\u003cth\u003eDN\u003cbr\u003emm\u003c/th\u003e\u003cth\u003eDI\u003cbr\u003emm\u003c/th\u003e\u003cth\u003eDE\u003cbr\u003emm\u003c/th\u003e\u003cth\u003eQ a 75%\u003cbr\u003eL/s\u003c/th\u003e\u003cth\u003eV a 75%\u003cbr\u003em/s\u003c/th\u003e\u003cth\u003eQ a seção plena\u003cbr\u003eL/s\u003c/th\u003e\u003cth\u003eσt a 75%\u003cbr\u003ePa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n        \u003ctbody id=\"tbCmp\"\u003e\u003c/tbody\u003e\n      \u003c/table\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"grade g2\" style=\"margin-top:14px\"\u003e\n    \u003cdetails class=\"doc\" open=\"\"\u003e\n      \u003csummary\u003ePEAD — notas de especificação\u003c/summary\u003e\n      \u003cdiv class=\"corpo\"\u003e\n        \u003cp\u003e\u003cb\u003ePEAD corrugado de parede dupla (PEAD-DP)\u003c/b\u003e — parede externa corrugada, parede interna lisa. É o produto usual em coletores por gravidade de DN 100 a DN 1200. Classificado pela rigidez anelar SN (kN/m²): SN 4 para recobrimentos correntes, SN 8 sob tráfego pesado ou grandes profundidades, SN 16 em situações críticas. Referências de ensaio e classificação: EN 13476 e ISO 21138 para tubos de parede estruturada.\u003c/p\u003e\n        \u003cp\u003e\u003cb\u003ePEAD liso PE 100\u003c/b\u003e — usado em linhas de recalque, travessias e sifões invertidos, onde há pressão interna. Especificado por SDR e PN; o diâmetro interno depende da série adotada, o que reduz sensivelmente a área útil em relação ao DE nominal.\u003c/p\u003e\n        \u003cp\u003e\u003cb\u003eCuidados de projeto\u003c/b\u003e — a leveza do PEAD facilita o assentamento, mas transfere a responsabilidade estrutural para o solo lateral: a deflexão depende muito mais de E\u0027 do que da rigidez do tubo. Exija compactação controlada da envoltória lateral e verifique flutuação quando houver lençol acima da geratriz superior. Em juntas soldadas por eletrofusão, exija qualificação de soldador e registro dos parâmetros de fusão.\u003c/p\u003e\n        \u003cp\u003e\u003cb\u003eRugosidade\u003c/b\u003e — o interior liso permite n entre 0,009 e 0,011. Para a verificação normativa da NBR 9649 o valor a usar continua sendo n = 0,013; o ganho hidráulico do material só pode ser invocado se a norma ou o contratante admitirem expressamente.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/details\u003e\n    \u003cdetails class=\"doc\"\u003e\n      \u003csummary\u003eEscolha de material — critérios práticos\u003c/summary\u003e\n      \u003cdiv class=\"corpo\"\u003e\n        \u003cul\u003e\n          \u003cli\u003e\u003cb\u003ePVC\u003c/b\u003e — padrão em redes urbanas até DN 400. Junta elástica, leve, boa resistência química, custo competitivo.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003ePEAD corrugado\u003c/b\u003e — vantajoso em solos agressivos, terrenos com recalque diferencial, travessias e onde a junta soldada elimina infiltração. Cobre faixa de diâmetros maior que o PVC.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eConcreto\u003c/b\u003e — diâmetros grandes (DN ≥ 400), interceptores e emissários. Exige proteção contra ataque por H₂S em trechos com baixa velocidade ou queda livre.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eCerâmica (grês)\u003c/b\u003e — excelente resistência química e à abrasão; fragilidade no manuseio e custo restringem o uso.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eFerro fundido\u003c/b\u003e — travessias, trechos aéreos, sifões e onde há carga externa elevada ou pequeno recobrimento.\u003c/li\u003e\n        \u003c/ul\u003e\n        \u003cp class=\"dim\"\u003eA definição do material em obra pública precisa de justificativa técnica no projeto básico. Especificação de marca ou de material sem motivação técnica é restrição indevida à competitividade.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/details\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 09 CONFORMIDADE ============ --\u003e\n\u003csection class=\"painel\" id=\"pConformidade\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eVerificação de conformidade\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eChecagem automática dos critérios hidráulicos e de assentamento, e roteiro de verificação documental para projeto básico de obra pública.\u003c/p\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eCritérios hidráulicos e geométricos \u003cspan class=\"tag\"\u003eautomático\u003c/span\u003e\u003c/h3\u003e\n      \u003cul class=\"lista-check\" id=\"chkAuto\"\u003e\u003c/ul\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"card\"\u003e\n      \u003ch3\u003eRoteiro documental \u003cspan class=\"tag\"\u003epreenchimento manual\u003c/span\u003e\u003c/h3\u003e\n      \u003cul class=\"lista-check\" id=\"chkDoc\"\u003e\u003c/ul\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"divisor\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"grade g2\"\u003e\n    \u003cdetails class=\"doc\" open=\"\"\u003e\n      \u003csummary\u003eReferências normativas aplicáveis\u003c/summary\u003e\n      \u003cdiv class=\"corpo\"\u003e\n        \u003cul\u003e\n          \u003cli\u003e\u003cb\u003eABNT NBR 9649\u003c/b\u003e — Projeto de redes coletoras de esgoto sanitário. Fixa vazão mínima de 1,5 L/s, tensão trativa mínima de 1,0 Pa, lâmina máxima de 75% e n = 0,013.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eABNT NBR 14486\u003c/b\u003e — Sistemas enterrados para condução de esgoto sanitário: projeto de redes coletoras com tubos de PVC.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eABNT NBR 12207\u003c/b\u003e — Projeto de interceptores de esgoto sanitário.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eABNT NBR 7362\u003c/b\u003e — Tubos de PVC com junta elástica para coletor de esgoto.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eABNT NBR 8890\u003c/b\u003e — Tubo de concreto de seção circular para águas pluviais e esgoto sanitário.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eABNT NBR 12266\u003c/b\u003e — Projeto e execução de valas para assentamento de tubulações.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eEN 13476 / ISO 21138\u003c/b\u003e — Tubos de parede estruturada em PE, PP e PVC-U (referência para PEAD corrugado).\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eNR-18\u003c/b\u003e — Segurança em escavações e escoramento de valas.\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n    \u003c/details\u003e\n    \u003cdetails class=\"doc\" open=\"\"\u003e\n      \u003csummary\u003ePontos de atenção em fiscalização e auditoria\u003c/summary\u003e\n      \u003cdiv class=\"corpo\"\u003e\n        \u003cul\u003e\n          \u003cli\u003e\u003cb\u003eProjeto básico deficiente\u003c/b\u003e — rede dimensionada sem memória de cálculo trecho a trecho, sem perfil longitudinal e sem cadastro do sistema existente é causa recorrente de aditivos.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eQuantitativo de escavação\u003c/b\u003e — verifique se a profundidade adotada no orçamento corresponde à do perfil. Superestimar profundidade média infla escavação, escoramento e esgotamento simultaneamente.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eEscoramento\u003c/b\u003e — a faixa de profundidade determina o tipo. Orçar escoramento contínuo onde o perfil indica valas rasas é sobrepreço; não orçar onde é exigido é risco à segurança e fonte de aditivo.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eEsgotamento de vala\u003c/b\u003e — só cabe onde o perfil cruza o lençol. Deve estar demonstrado por sondagem, não presumido.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eMaterial especificado\u003c/b\u003e — a troca de PVC por PEAD, ou vice-versa, durante a execução altera preço e exige justificativa técnica e reequilíbrio formalizado.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eTensão trativa\u003c/b\u003e — trechos iniciais com declividade abaixo da mínima geram assoreamento e manutenção permanente. É defeito de projeto, não de operação.\u003c/li\u003e\n          \u003cli\u003e\u003cb\u003eLigações prediais\u003c/b\u003e — quantidade e profundidade precisam estar compatíveis com o número de economias previstas no estudo populacional.\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n    \u003c/details\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 10 RELATÓRIO ============ --\u003e\n\u003csection class=\"painel\" id=\"pRelatorio\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eRelatório técnico\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eDocumento consolidado para impressão ou geração de PDF pelo próprio navegador.\u003c/p\u003e\n  \u003cdiv class=\"barra naoimprime\"\u003e\n    \u003cbutton class=\"pri\" id=\"btGerarRel\"\u003eGerar relatório\u003c/button\u003e\n    \u003cbutton id=\"btImprimir2\"\u003eImprimir / salvar em PDF\u003c/button\u003e\n    \u003clabel class=\"ck\" style=\"margin:0\"\u003e\u003cinput type=\"checkbox\" id=\"relPerfil\" checked=\"\"\u003e incluir perfil longitudinal\u003c/label\u003e\n    \u003clabel class=\"ck\" style=\"margin:0\"\u003e\u003cinput type=\"checkbox\" id=\"relOrc\" checked=\"\"\u003e incluir planilha orçamentária\u003c/label\u003e\n  \u003c/div\u003e\n  \u003cdiv id=\"relatorio\"\u003e\u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- ============ 11 TESTES ============ --\u003e\n\u003csection class=\"painel\" id=\"pTestes\" role=\"tabpanel\" hidden=\"\"\u003e\n  \u003ch2 class=\"titulo\"\u003eAutoteste do núcleo de cálculo\u003c/h2\u003e\n  \u003cp class=\"lede\"\u003eBateria de verificações executada no próprio navegador contra soluções analíticas, valores tabelados e casos-limite.\u003c/p\u003e\n  \u003cdiv class=\"barra\"\u003e\n    \u003cbutton class=\"pri\" id=\"btTestar\"\u003eExecutar testes\u003c/button\u003e\n    \u003cspan class=\"esp\"\u003e\u003c/span\u003e\n    \u003cspan id=\"seloTestes\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"tabela-rolo\"\u003e\n    \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth style=\"width:44px\"\u003e#\u003c/th\u003e\u003cth class=\"esq\"\u003eGrupo\u003c/th\u003e\u003cth class=\"esq\"\u003eVerificação\u003c/th\u003e\u003cth\u003eObtido\u003c/th\u003e\u003cth\u003eEsperado\u003c/th\u003e\u003cth style=\"width:70px\"\u003eStatus\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody id=\"tbTestes\"\u003e\u003c/tbody\u003e\u003c/table\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c/main\u003e\n\n\u003cdiv class=\"rodape\"\u003e\n  \u003cb\u003eEsgotoCalc Pro\u003c/b\u003e — ferramenta de apoio ao dimensionamento e ao orçamento de redes coletoras de esgoto sanitário. Custos de referência: SINAPI São Paulo/SP, 06/2026. Os resultados não substituem a análise de profissional habilitado nem dispensam a consulta às normas ABNT vigentes e aos catálogos dos fabricantes. Dados de diâmetros e rugosidades são valores de referência para anteprojeto.\n\u003c/div\u003e\n\u003cdiv class=\"toast\" id=\"toast\"\u003e\u003c/div\u003e\n\u003cscript\u003e\n/* ==================================================================\n   EsgotoCalc Pro — núcleo de cálculo\n   Este bloco é puro (sem DOM) e é extraído integralmente pela\n   suíte de testes em Node.js. Não inserir referências a document\n   ou window entre os marcadores CORE-START e CORE-END.\n   ================================================================== */\n/* ==CORE-START== */\nvar NUCLEO = (function () {\n  \u0027use strict\u0027;\n  var G = 9.81;\n\n  /* ---------------- utilidades numéricas ---------------- */\n  function num(v, padrao) {\n    if (v === null || v === undefined || v === \u0027\u0027) return padrao === undefined ? 0 : padrao;\n    if (typeof v === \u0027number\u0027) return isFinite(v) ? v : (padrao === undefined ? 0 : padrao);\n    var s = String(v).trim().replace(/\\s/g, \u0027\u0027);\n    if (s.indexOf(\u0027,\u0027) \u003e -1 \u0026\u0026 s.indexOf(\u0027.\u0027) \u003e -1) s = s.replace(/\\./g, \u0027\u0027).replace(\u0027,\u0027, \u0027.\u0027);\n    else s = s.replace(\u0027,\u0027, \u0027.\u0027);\n    var n = parseFloat(s);\n    return isFinite(n) ? n : (padrao === undefined ? 0 : padrao);\n  }\n  function arred(v, casas) {\n    var f = Math.pow(10, casas || 0);\n    return Math.round((v + Number.EPSILON) * f) / f;\n  }\n  function limitar(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }\n\n  /* ---------------- geometria de seção circular ---------------- */\n  // Y/D -\u003e ângulo central molhado (rad)\n  function theta(yd) {\n    var y = limitar(yd, 1e-12, 1);\n    return 2 * Math.acos(1 - 2 * y);\n  }\n  function areaMolhada(D, yd) {\n    if (yd \u003e= 1) return Math.PI * D * D / 4;\n    var t = theta(yd);\n    return (D * D / 8) * (t - Math.sin(t));\n  }\n  function perimetroMolhado(D, yd) {\n    if (yd \u003e= 1) return Math.PI * D;\n    return theta(yd) * D / 2;\n  }\n  function raioHidraulico(D, yd) {\n    if (yd \u003e= 1) return D / 4;\n    var t = theta(yd);\n    return (D / 4) * (1 - Math.sin(t) / t);\n  }\n  function larguraSuperficie(D, yd) {\n    if (yd \u003e= 1) return 0;\n    return D * Math.sin(theta(yd) / 2);\n  }\n\n  /* ---------------- Manning ---------------- */\n  // D em m, I em m/m -\u003e Q em m3/s\n  function vazaoManning(D, yd, n, I) {\n    if (D \u003c= 0 || n \u003c= 0 || I \u003c= 0 || yd \u003c= 0) return 0;\n    var A = areaMolhada(D, yd), Rh = raioHidraulico(D, yd);\n    return (1 / n) * A * Math.pow(Rh, 2 / 3) * Math.sqrt(I);\n  }\n  function velocidade(D, yd, n, I) {\n    var A = areaMolhada(D, yd);\n    return A \u003e 0 ? vazaoManning(D, yd, n, I) / A : 0;\n  }\n  function vazaoPlena(D, n, I) { return vazaoManning(D, 1, n, I); }\n\n  // Lâmina relativa a partir da vazão (bisseção na região monotônica)\n  var YD_SUP = 0.93;\n  function laminaRelativa(Q, D, n, I) {\n    if (Q \u003c= 0) return 0;\n    var qMax = vazaoManning(D, YD_SUP, n, I);\n    if (Q \u003e qMax) return null;                 // trecho afogado / sem solução no domínio\n    var a = 1e-9, b = YD_SUP, m = 0;\n    for (var k = 0; k \u003c 200; k++) {\n      m = (a + b) / 2;\n      if (vazaoManning(D, m, n, I) \u003c Q) a = m; else b = m;\n      if (b - a \u003c 1e-12) break;\n    }\n    return (a + b) / 2;\n  }\n  // Declividade necessária para uma dada lâmina\n  function declividadeParaLamina(Q, D, n, yd) {\n    var A = areaMolhada(D, yd), Rh = raioHidraulico(D, yd);\n    if (A \u003c= 0) return Infinity;\n    var r = Q * n / (A * Math.pow(Rh, 2 / 3));\n    return r * r;\n  }\n\n  /* ---------------- critérios da NBR 9649 ---------------- */\n  function tensaoTrativa(D, yd, I, gama) {\n    return (gama === undefined ? 10000 : gama) * raioHidraulico(D, yd) * I;\n  }\n  function velocidadeCritica(D, yd) { return 6 * Math.sqrt(G * raioHidraulico(D, yd)); }\n  // Qi em L/s -\u003e I mínima (m/m), tensão trativa de 1,0 Pa e n = 0,013\n  function declividadeMinimaNBR(QiLs) {\n    var q = Math.max(QiLs, 1e-6);\n    return 0.0055 * Math.pow(q, -0.47);\n  }\n  // Qf em L/s -\u003e I máxima (m/m) correspondente a V = 5 m/s\n  function declividadeMaximaNBR(QfLs) {\n    var q = Math.max(QfLs, 1e-6);\n    return 4.65 * Math.pow(q, -0.67);\n  }\n  // Declividade mínima exata para atingir a tensão trativa alvo com a lâmina real\n  function declividadeMinimaTrativa(QiLs, D, n, ttAlvo, gama) {\n    var Q = QiLs / 1000, g = gama || 10000;\n    var lo = 1e-6, hi = 0.5;\n    for (var k = 0; k \u003c 120; k++) {\n      var m = (lo + hi) / 2;\n      var yd = laminaRelativa(Q, D, n, m);\n      // yd nulo significa seção sem capacidade: é preciso AUMENTAR a declividade\n      var tt = yd === null ? -Infinity : tensaoTrativa(D, yd, m, g);\n      if (tt \u003c ttAlvo) lo = m; else hi = m;\n    }\n    // hi é sempre o lado viável: garante seção com capacidade e σt \u003e= alvo.\n    // Se nem o limite superior tem capacidade, o diâmetro é insuficiente.\n    if (laminaRelativa(Q, D, n, hi) === null) return null;\n    return hi;\n  }\n\n  /* ---------------- verificação completa de um trecho ---------------- */\n  function verificarTrecho(p) {\n    var D = p.D;                       // m (diâmetro interno)\n    var n = p.n, I = p.I, gama = p.gama || 10000;\n    var Qi = Math.max(num(p.Qi), num(p.qMin, 1.5)) / 1000;  // m3/s\n    var Qf = Math.max(num(p.Qf), num(p.qMin, 1.5)) / 1000;\n    var ydMax = p.ydMax || 0.75, ydCrit = p.ydCrit || 0.50;\n    var ttMin = p.ttMin || 1.0, vMax = p.vMax || 5.0;\n\n    var ydI = laminaRelativa(Qi, D, n, I);\n    var ydF = laminaRelativa(Qf, D, n, I);\n    var afogado = (ydF === null);\n    var ydFc = afogado ? 1 : ydF;\n    var ydIc = (ydI === null) ? 1 : ydI;\n\n    var vI = velocidade(D, ydIc, n, I);\n    var vF = velocidade(D, ydFc, n, I);\n    var ttI = tensaoTrativa(D, ydIc, I, gama);\n    var ttF = tensaoTrativa(D, ydFc, I, gama);\n    var vc = velocidadeCritica(D, ydFc);\n    var ydLim = (vF \u003e vc) ? Math.min(ydMax, ydCrit) : ydMax;\n\n    var ok = {\n      trativa: ttI \u003e= ttMin - 1e-9,\n      lamina: !afogado \u0026\u0026 ydFc \u003c= ydLim + 1e-9,\n      velocidade: vF \u003c= vMax + 1e-9,\n      declividade: I \u003e= declividadeMinimaNBR(Qi * 1000) - 1e-9\n    };\n    var falhas = [];\n    if (!ok.trativa) falhas.push(\u0027tensão trativa\u0027);\n    if (!ok.lamina) falhas.push(afogado ? \u0027seção insufic nction (a) { return a.indexOf(\u0027equivalente\u0027) \u003e -1 || a.indexOf(\u0027orçado como\u0027) \u003e -1; }));\n\n    // rede vazia não quebra\n    var O6 = N.orcarRede({ trechos: [], nos: [], p: E.p });\n    verdade(\u0027Orçamento\u0027, \u0027Rede vazia devolve orçamento zerado sem erro\u0027,\n      O6.totalSemBDI === 0 \u0026\u0026 O6.itens.length === 0);\n  })();\n\n  return T;\n};\n/* ==TESTS-END== */\n\n/* ---------------- execução no navegador ---------------- */\nfunction executarTestes() {\n  var T = TESTES_DEF(NUCLEO), tb = document.querySelector(\u0027#tbTestes\u0027);\n  tb.innerHTML = \u0027\u0027;\n  var falhas = 0;\n  T.forEach(function (t, i) {\n    if (!t.p) falhas++;\n    var tr = document.createElement(\u0027tr\u0027);\n    if (!t.p) tr.className = \u0027reprovado\u0027;\n    function c(txt, cls) { var d = document.createElement(\u0027td\u0027); d.className = cls || \u0027\u0027; d.textContent = txt; return d; }\n    tr.appendChild(c(String(i + 1)));\n    tr.appendChild(c(t.g, \u0027esq txt\u0027));\n    tr.appendChild(c(t.n, \u0027esq txt\u0027));\n    tr.appendChild(c(typeof t.o === \u0027number\u0027 ? NUCLEO.fmt(t.o, 6) : String(t.o)));\n    tr.appendChild(c(typeof t.e === \u0027number\u0027 ? NUCLEO.fmt(t.e, 6) : String(t.e)));\n    var s = document.createElement(\u0027td\u0027);\n    s.innerHTML = \u0027\u003cspan class=\"selo \u0027 + (t.p ? \u0027ok\u0027 : \u0027fail\u0027) + \u0027\"\u003e\u0027 + (t.p ? \u0027ok\u0027 : \u0027falha\u0027) + \u0027\u003c/span\u003e\u0027;\n    tr.appendChild(s);\n    tb.appendChild(tr);\n  });\n  var sel = document.querySelector(\u0027#seloTestes\u0027);\n  sel.innerHTML = \u0027\u003cspan class=\"selo \u0027 + (falhas ? \u0027fail\u0027 : \u0027ok\u0027) + \u0027\"\u003e\u0027 +\n    (falhas ? falhas + \u0027 falha(s) em \u0027 + T.length + \u0027 verificações\u0027 : T.length + \u0027 verificações aprovadas\u0027) + \u0027\u003c/span\u003e\u0027;\n}\n\u003c/script\u003e\n\n\u003cscript src=\"fde5a577-b9bc-4a07-b4ab-b68409e7318d\"\u003e\u003c/script\u003e\n\u003cscript\u003e\n/* ============ Tela de abertura: animação 3D da rede coletora ============ */\n(function(){\n  var DUR=4000, raiz=document.documentElement, splash=document.getElementById(\u0027ecp-splash\u0027);\n  if(!splash) return;\n  raiz.classList.add(\u0027ecp-travado\u0027);\n  var hud=document.getElementById(\u0027ecp-hud\u0027), prog=document.getElementById(\u0027ecp-prog\u0027),\n      logEl=document.getElementById(\u0027ecp-log\u0027), aviso=document.getElementById(\u0027ecp-aviso\u0027),\n      chk=document.getElementById(\u0027ecp-check\u0027), btnOk=document.getElementById(\u0027ecp-entrar\u0027),\n      btnNo=document.getElementById(\u0027ecp-sair\u0027), cv=document.getElementById(\u0027ecp-canvas\u0027);\n  var raf=null, renderer=null, t0=performance.now(), fimChamado=false;\n  var etapas=[[0,\u0027lendo topografia do traçado\u0027],[900,\u0027lançando coletores e poços de visita\u0027],\n              [1900,\u0027verificando declividades e tensão trativa\u0027],[2900,\u0027preparando ambiente de projeto\u0027]];\n\n  function easeIO(t){return t\u003c.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}\n  function easeOut(t){return 1-Math.pow(1-t,3);}\n\n  /* ---------- cena ---------- */\n  var cena,cam,grupo=[],flux=[],ok=false;\n  try{\n    if(!window.THREE) throw 0;\n    renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));\n    renderer.setSize(cv.clientWidth||window.innerWidth, cv.clientHeight||window.innerHeight,false);\n    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;\n    if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;\n    renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;\n\n    cena=new THREE.Scene();\n    cena.background=new THREE.Color(0x07161B);\n    cena.fog=new THREE.FogExp2(0x07161B,0.008);\n    cam=new THREE.PerspectiveCamera(38,1,.1,400);\n\n    cena.add(new THREE.HemisphereLight(0xCDEDF7,0x24413C,1.05));\n    var sol=new THREE.DirectionalLight(0xFFF3DF,1.25); sol.position.set(24,34,18);\n    sol.castShadow=true; sol.shadow.mapSize.set(1024,1024);\n    sol.shadow.camera.left=-40;sol.shadow.camera.right=40;sol.shadow.camera.top=40;sol.shadow.camera.bottom=-40;\n    cena.add(sol);\n    var pl=new THREE.PointLight(0x7FD8F0,1.6,80); pl.position.set(0,-2,0); cena.add(pl);\n    var pl2=new THREE.PointLight(0xFFE7C4,.9,90); pl2.position.set(-18,10,22); cena.add(pl2);\n\n    /* terreno translúcido (corte) */\n    var solo=new THREE.Mesh(new THREE.BoxGeometry(120,.6,90),\n      new THREE.MeshStandardMaterial({color:0x143038,roughness:.95,metalness:0,transparent:true,opacity:.22}));\n    solo.position.y=0; solo.receiveShadow=true; cena.add(solo);\n    var g=new THREE.GridHelper(120,60,0x2E5A66,0x1B3B45); g.position.y=.32;\n    g.material.transparent=true; g.material.opacity=.5; cena.add(g);\n\n    var matTubo=new THREE.MeshStandardMaterial({color:0xF2F7F8,roughness:.30,metalness:.10,\n      emissive:0x2E7C96,emissiveIntensity:.55,\n      transparent:true,opacity:.82,side:THREE.DoubleSide});\n    var matFluxo=new THREE.MeshBasicMaterial({color:0x6FE0FF,transparent:true,opacity:.9});\n    var matPV=new THREE.MeshStandardMaterial({color:0xD8DCD6,roughness:.75,metalness:.05,\n      emissive:0x1E3A44,emissiveIntensity:.4,transparent:true,opacity:.92});\n    var matTampa=new THREE.MeshStandardMaterial({color:0xC98B2A,roughness:.5,metalness:.5,\n      emissive:0x3A2408,emissiveIntensity:.5});\n\n    function tubo(a,b,r,ordem){\n      var dir=new THREE.Vector3().subVectors(b,a), len=dir.length();\n      var geo=new THREE.CylinderGeometry(r,r,len,26,1,true); geo.translate(0,len/2,0);\n      var m=new THREE.Mesh(geo,matTubo); m.castShadow=true;\n      m.position.copy(a);\n      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());\n      cena.add(m);\n      var gi=new THREE.CylinderGeometry(r*.62,r*.62,len,20,1,true); gi.translate(0,len/2,0);\n      var f=new THREE.Mesh(gi,matFluxo); f.position.copy(m.position); f.quaternion.copy(m.quaternion);\n      cena.add(f);\n      grupo.push({m:m,f:f,ordem:ordem});\n      /* partículas de escoamento */\n      for(var k=0;k\u003c4;k++){\n        var s=new THREE.Mesh(new THREE.SphereGeometry(r*.42,12,12),\n          new THREE.MeshBasicMaterial({color:0x8FE6FF,transparent:true,opacity:.85}));\n        cena.add(s); flux.push({s:s,a:a.clone(),b:b.clone(),off:k/4,ordem:ordem});\n      }\n    }\n    function pv(p,prof,ordem){\n      var c=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,prof,28,1,true),matPV);\n      c.position.set(p.x,p.y+prof/2,p.z); c.castShadow=true; cena.add(c);\n      var t=new THREE.Mesh(new THREE.TorusGeometry(1.05,.13,10,32),matTampa);\n      t.rotation.x=Math.PI/2; t.position.set(p.x,p.y+prof,p.z); cena.add(t);\n      grupo.push({m:c,f:t,ordem:ordem,pv:true});\n    }\n\n    var nos=[],i,x,y;\n    for(i=0;i\u003c7;i++){ x=-21+i*7; y=-1.4-i*0.34; nos.push(new THREE.Vector3(x,y,0)); }\n    for(i=0;i\u003cnos.length-1;i++) tubo(nos[i],nos[i+1],.62,i*0.9);\n    for(i=0;i\u003cnos.length;i++) pv(nos[i],-nos[i].y,i*0.9+.3);\n    for(i=1;i\u003c6;i++){\n      var sg=(i%2===0)?1:-1, ini=new THREE.Vector3(nos[i].x-2.2,nos[i].y+1.15,sg*11);\n      tubo(ini,nos[i],.42,1.1+i*0.75);\n      pv(ini,-ini.y,1.1+i*0.75+.2);\n    }\n    ok=true;\n  }catch(e){ ok=false; }\n\n  function resize(){\n    if(!ok) return;\n    var w=splash.clientWidth,h=splash.clientHeight;\n    renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();\n  }\n  window.addEventListener(\u0027resize\u0027,resize); resize();\n\n  var vAlvo=new THREE.Vector3?new THREE.Vector3():null;\n  function quadro(now){\n    var t=Math.min((now-t0)/DUR,1);\n    prog.style.right=(100-t*100)+\u0027%\u0027;\n    for(var e=etapas.length-1;e\u003e=0;e--){ if(now-t0\u003e=etapas[e][0]){ if(logEl.textContent!==etapas[e][1]) logEl.textContent=etapas[e][1]; break; } }\n    if(now-t0\u003e500) hud.classList.add(\u0027on\u0027);\n\n    if(ok){\n      var q=easeIO(t);\n      var ang=-0.95+q*0.60, rad=72-q*26, alt=42-q*22;\n      cam.position.set(Math.cos(ang)*rad, alt, Math.sin(ang)*rad+6);\n      cam.lookAt(0,-2.4,0);\n      for(var i=0;i\u003cgrupo.length;i++){\n        var it=grupo[i], p=Math.max(0,Math.min(1,(t*4.1-it.ordem)/1.05)), s=easeOut(p);\n        if(it.pv){ it.m.scale.y=Math.max(.0001,s); it.f.visible=s\u003e.94;\n                   it.f.scale.setScalar(s\u003e.94?1:.001); }\n        else { it.m.scale.y=Math.max(.0001,s); it.f.scale.y=Math.max(.0001,s); }\n      }\n      var tt=(now-t0)/1000;\n      for(var j=0;j\u003cflux.length;j++){\n        var fx=flux[j], vis=(t*4.1-fx.ordem)\u003e1.0;\n        fx.s.visible=vis;\n        if(vis){ var u=((tt*.42+fx.off)%1);\n          fx.s.position.lerpVectors(fx.a,fx.b,u);\n          fx.s.material.opacity=.9*Math.sin(Math.PI*Math.min(1,Math.max(0,u)));\n        }\n      }\n      renderer.render(cena,cam);\n    }\n    if(t\u003e=1 \u0026\u0026 !fimChamado){ fimChamado=true; fim(); }\n    if(t\u003e=1){ raf=null; return; }\n    raf=requestAnimationFrame(quadro);\n  }\n  function fim(){ aviso.classList.add(\u0027on\u0027); setTimeout(function(){ chk.focus(); },560); }\n\n  chk.addEventListener(\u0027change\u0027,function(){ btnOk.disabled=!chk.checked; });\n  btnNo.addEventListener(\u0027click\u0027,function(){\n    logEl.textContent=\u0027acesso não autorizado pelo usuário\u0027;\n    aviso.querySelector(\u0027.ecp-card\u0027).innerHTML=\u0027\u003cdiv class=\"kick\"\u003eSessão encerrada\u003c/div\u003e\u0027+\n      \u0027\u003ch2\u003eÉ necessário concordar com o termo para utilizar o sistema.\u003c/h2\u003e\u0027+\n      \u0027\u003cdiv class=\"regra\"\u003e\u003c/div\u003e\u003cp\u003eRecarregue a página para revisar o aviso legal e acessar o EsgotoCalc Pro.\u003c/p\u003e\u0027;\n  });\n  function abrirSistema(){\n    if(!chk.checked) return;\n    splash.classList.add(\u0027saindo\u0027); raiz.classList.remove(\u0027ecp-travado\u0027);\n    setTimeout(function(){\n      if(raf) cancelAnimationFrame(raf);\n      try{ if(renderer){ renderer.dispose(); } }catch(e){}\n      splash.remove();\n      var css=document.getElementById(\u0027ecp-splash-css\u0027); if(css) css.remove();\n      window.dispatchEvent(new Event(\u0027resize\u0027));\n    },520);\n  }\n  btnOk.addEventListener(\u0027click\u0027,abrirSistema);\n  raf=requestAnimationFrame(quadro);\n  /* garantia: se o rAF for estrangulado (aba em segundo plano), o aviso legal aparece assim mesmo */\n  setTimeout(function(){ if(!fimChamado){ fimChamado=true; prog.style.right=\u00270%\u0027; hud.classList.add(\u0027on\u0027); logEl.textContent=etapas[etapas.length-1][1]; fim(); } }, DUR+500);\n})();\n\u003c/script\u003e\n\n\n\n\u003c/body\u003e\u003c/html\u003e"
  </script>
